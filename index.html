<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#0d1015"><title>RSL Shop</title>
<script src="https://telegram.org/js/telegram-web-app.js?64"></script>
<style>
:root{color-scheme:dark;--bg:#0d1015;--panel:#171c23;--panel2:#202731;--line:#29333e;--ink:#f3f5f6;--muted:#9ba8b3;--teal:#9ce3d5;--deep:#244d49;--amber:#e6bd83;--red:#f59b9b;--r:18px;--safe:env(safe-area-inset-bottom,0px)}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 80% -8%,#28524b 0,transparent 35%),var(--bg);color:var(--ink);font:15px/1.45 Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-height:100vh;padding-bottom:calc(82px + var(--safe))}button,input{font:inherit}button{cursor:pointer;color:inherit}.app{width:min(760px,100%);margin:0 auto;padding:0 18px}.top{height:66px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:4;background:#0d1015e8;backdrop-filter:blur(16px);border-bottom:1px solid #ffffff0c;margin:0 -18px;padding:0 18px}.brand{display:flex;align-items:center;gap:10px}.logo{width:35px;height:35px;border:1px solid #72bead88;border-radius:12px;display:grid;place-items:center;color:var(--teal);font-size:11px;font-weight:900;letter-spacing:-.7px;background:linear-gradient(145deg,#25443f,#151d22)}.brandname{font-size:14px;font-weight:800;letter-spacing:.4px}.eyebrow{font-size:10px;color:var(--muted);letter-spacing:1.7px;text-transform:uppercase}.balancepill{border:1px solid #46645f;border-radius:99px;background:#182722;padding:7px 11px;color:#c4f0e7;font-size:12px;font-weight:700}.hero{padding:24px 0 17px}.hero .eyebrow{color:var(--teal)}h1{font-size:27px;line-height:1.15;letter-spacing:-.8px;margin:8px 0 8px}.subtext{color:var(--muted);font-size:13px;margin:0}.sectionhead{display:flex;align-items:end;justify-content:space-between;margin:19px 0 12px}.sectionhead h2{font-size:17px;letter-spacing:-.3px;margin:0}.sectionhead span{font-size:11px;color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}.category,.product{overflow:hidden;border:1px solid var(--line);background:linear-gradient(155deg,#1c242b,#151a20);border-radius:var(--r);text-align:left;padding:0;transition:transform .16s,border-color .16s;min-width:0}.category:active,.product:active,.action:active{transform:scale(.985)}.cover{height:auto;aspect-ratio:1/1;background:linear-gradient(135deg,#355c57,#202d35 55%,#b18856);background-size:cover;background-position:center;position:relative}.cover:after{content:"";position:absolute;inset:35% 0 0;background:linear-gradient(transparent,#10151bd9)}.category-info,.product-info{padding:11px 12px 13px}.category-name{font-size:14px;font-weight:750;line-height:1.3}.category-meta{font-size:11px;color:var(--muted);margin-top:4px}.product-cover{height:119px;background:linear-gradient(140deg,#29443f,#202b34 55%,#816e51);background-size:cover;background-position:center}.product-info{display:flex;flex-direction:column;gap:5px}.product-title{font-size:13px;font-weight:720;line-height:1.32}.price{color:var(--teal);font-size:14px;font-weight:780}.stock{font-size:10px;color:var(--muted)}.stock.out{color:var(--red)}.crumb{display:flex;gap:8px;align-items:center;color:var(--muted);font-size:12px;margin:17px 0 12px}.crumb button{border:0;background:none;color:var(--teal);padding:0}.back{border:0;background:none;color:var(--teal);padding:0 0 10px;font-size:13px}.empty{padding:25px 16px;border:1px dashed #36434d;border-radius:var(--r);text-align:center;color:var(--muted);grid-column:1/-1}.detail{margin:15px 0;border:1px solid var(--line);border-radius:22px;overflow:hidden;background:var(--panel)}.detail-cover{height:215px;background:linear-gradient(135deg,#31524c,#252e38 60%,#9a805c);background-size:cover;background-position:center}.detail-body{padding:18px}.detail-body h2{margin:0 0 7px;font-size:21px;letter-spacing:-.5px}.detail-desc{font-size:12px;color:var(--muted)}.detail-price{font-size:23px;color:var(--teal);font-weight:800;margin:16px 0 2px}.qtyrow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 0;border-top:1px solid var(--line);margin-top:14px}.qtyrow label{font-size:12px;color:var(--muted)}.qty{width:98px;text-align:center;background:#0f1419;border:1px solid #39434d;border-radius:11px;color:var(--ink);padding:10px}.total{display:flex;justify-content:space-between;align-items:center;margin:7px 0 15px;font-size:13px}.total b{font-size:18px;color:var(--teal)}.action{width:100%;border:0;border-radius:13px;background:linear-gradient(115deg,#b7f1e3,#7dcbbb);color:#10201e;padding:13px 15px;font-weight:850;letter-spacing:.1px}.action:disabled{opacity:.45}.secondary{width:100%;border:1px solid #46545f;background:#202932;border-radius:12px;padding:11px;font-weight:700}.notice{padding:13px;border-radius:13px;background:#28271f;border:1px solid #5b5035;color:#eed9ad;font-size:12px;margin:13px 0}.account{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:16px 0}.stat{border:1px solid var(--line);background:#171d23;border-radius:15px;padding:14px}.stat small{display:block;color:var(--muted);font-size:11px}.stat strong{display:block;font-size:17px;margin-top:6px}.sheet{border:1px solid var(--line);border-radius:18px;background:var(--panel);padding:16px;margin:13px 0}.field{width:100%;padding:12px 13px;border-radius:12px;border:1px solid #3a4652;background:#0f1419;color:var(--ink);margin:7px 0 13px}.qr{width:min(250px,100%);display:block;margin:14px auto;border-radius:14px;background:#fff;padding:8px}.code{font:700 16px ui-monospace,monospace;text-align:center;color:var(--teal);padding:10px;border-radius:10px;background:#0e1418;letter-spacing:1px;user-select:all}.keys{display:grid;gap:8px;margin:15px 0}.key{display:flex;align-items:flex-start;gap:8px;padding:11px;border:1px solid #34534d;background:#17231f;border-radius:11px}.key code{font:13px/1.5 ui-monospace,monospace;overflow-wrap:anywhere;flex:1}.copy{border:1px solid #55786e;background:#233a34;color:#c6f4e9;border-radius:8px;padding:6px 9px;font-size:11px;font-weight:700;flex-shrink:0}.dock{position:fixed;z-index:5;bottom:0;left:0;right:0;padding:10px 14px calc(10px + var(--safe));background:#10151beF;border-top:1px solid #ffffff12;backdrop-filter:blur(18px)}.dockin{width:min(760px,100%);margin:auto;display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.tab{border:0;background:none;color:#8996a1;border-radius:12px;padding:8px 4px 5px;font-size:10px}.tab b{display:block;font-size:17px;line-height:1.3;margin-bottom:2px}.tab.active{color:var(--teal);background:#23332f}.toast{position:fixed;z-index:10;left:50%;bottom:calc(92px + var(--safe));transform:translate(-50%,15px);opacity:0;pointer-events:none;background:#e3fff6;color:#142725;border-radius:11px;padding:11px 16px;font-size:12px;font-weight:750;box-shadow:0 10px 35px #0005;transition:.2s;max-width:calc(100vw - 32px);text-align:center}.toast.show{opacity:1;transform:translate(-50%,0)}.loading{padding:36px 10px;text-align:center;color:var(--muted)}.avatar{width:30px;height:30px;border-radius:50%;object-fit:cover;border:1px solid #61786f}.profile-avatar,.profile-fallback{width:44px;height:44px;flex:0 0 44px;border-radius:50%;object-fit:cover;border:1px solid #61786f}.profile-fallback{display:grid;place-items:center;background:#243632;color:var(--teal);font-weight:800;font-size:18px}.screen{display:none}.screen.active{display:block}.maintenance{padding:40px 18px;text-align:center}.maintenance h1{font-size:23px}.maintenance p{color:var(--muted)}
.purchase-record{border:1px solid var(--line);background:linear-gradient(150deg,#1c242b,#151a20);border-radius:16px;padding:14px;margin:10px 0}.purchase-top{display:flex;justify-content:space-between;gap:12px;align-items:start;border-bottom:1px solid var(--line);padding-bottom:10px}.purchase-id{font-size:12px;font-weight:800}.purchase-date{font-size:10px;color:var(--muted);margin-top:3px}.purchase-total{color:var(--teal);font-weight:850;white-space:nowrap}.purchase-details{display:grid;gap:9px;padding:11px 0}.purchase-field small{display:block;color:var(--muted);font-size:10px;margin-bottom:2px}.purchase-field strong{display:block;font-size:12px;overflow-wrap:anywhere}.purchase-keys{display:grid;gap:6px;margin:4px 0 9px}.purchase-key{display:flex;align-items:flex-start;gap:8px;padding:8px 9px;background:#10161b;border:1px solid #303c45;border-radius:9px}.purchase-key code{font:11px/1.45 ui-monospace,monospace;overflow-wrap:anywhere;flex:1}.purchase-key .copy{padding:5px 7px}.history-empty{padding:20px 13px;border:1px dashed #36434d;border-radius:14px;text-align:center;color:var(--muted);font-size:12px}.category-illustration{margin:14px 0 18px;border:1px solid var(--line);border-radius:18px;overflow:hidden;background:#151c22}.category-illustration img{display:block;width:100%;height:auto;max-height:420px;object-fit:contain;margin:auto}.top-deposit-list{display:grid;gap:9px;margin:12px 0}.top-deposit-entry{display:grid;grid-template-columns:40px minmax(0,1fr) auto;align-items:center;gap:11px;padding:13px;border:1px solid var(--line);border-radius:15px;background:linear-gradient(145deg,#1b242a,#151a20)}.top-deposit-entry:first-child{border-color:#c9a65b88;background:linear-gradient(120deg,#342c1d,#1b2024)}.top-deposit-rank{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;background:#25322f;color:var(--teal);font-size:13px;font-weight:850}.top-deposit-entry:first-child .top-deposit-rank{background:#c8a857;color:#1b1c18}.top-deposit-username{font-size:13px;font-weight:780;overflow-wrap:anywhere}.top-deposit-caption{font-size:10px;color:var(--muted);margin-top:2px}.top-deposit-total{font-size:13px;font-weight:850;color:var(--teal);white-space:nowrap}@media(min-width:600px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}.cover{height:auto;aspect-ratio:1/1}.product-cover{height:145px}.app{padding-left:22px;padding-right:22px}.top{margin-left:-22px;margin-right:-22px;padding-left:22px;padding-right:22px}}
</style>
</head>
<body>
<div class="app">
<header class="top"><div class="brand"><div class="logo">RSL</div><div><div class="brandname">RSL · DIGITAL GOODS</div><div class="eyebrow">Official shop</div></div></div><div style="display:flex;align-items:center;gap:9px"><img id="avatar" class="avatar" style="display:none"><button id="balance" class="balancepill" type="button" onclick="openAccount()">—</button></div></header>
<main id="main"><div id="loading" class="loading">Đang kết nối Telegram…</div></main>
</div>
<nav class="dock"><div class="dockin"><button class="tab active" data-tab="shop"><b>⌂</b>Cửa hàng</button><button class="tab" data-tab="deposit"><b>＋</b>Nạp tiền</button><button class="tab" data-tab="top"><b>★</b>Top nạp</button><button class="tab" data-tab="account"><b>◉</b>Tài khoản</button></div></nav>
<div id="toast" class="toast"></div>
<script>
(()=>{
const tg=window.Telegram?.WebApp;const params=new URLSearchParams(location.search);const API=(params.get('api')||'https://botbanhang.up.railway.app').replace(/\/+$/,'');let initData=tg?.initData||'';let account={balance:0,total_deposited:0,total_spent:0};let purchaseHistory=[],purchaseHistoryTotal=0,purchaseHistoryLoading=false;let roots=[],screen='shop',currentRoot=null,currentSub=null,currentProduct=null,deposit=null,depositAmount=0;
const $=s=>document.querySelector(s),money=n=>new Intl.NumberFormat('vi-VN').format(Number(n||0))+'đ',esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(s){const e=$('#toast');e.textContent=s;e.classList.add('show');clearTimeout(window._toast);window._toast=setTimeout(()=>e.classList.remove('show'),2800)}
async function api(path,opts={}){let res;try{res=await fetch(API+path,{...opts,headers:{'Content-Type':'application/json','X-Telegram-Init-Data':initData,...(opts.headers||{})}})}catch(e){throw Error('Không kết nối được máy chủ shop. Hãy thử lại sau.')};let d={};try{d=await res.json()}catch{}if(!res.ok){if(d.maintenance){maintenance(d.error,true);throw Error(d.error)}if(d.requires_start){maintenance(d.error,false);throw Error(d.error)}throw Error(d.error||'Yêu cầu không thành công.')}return d}
function maintenance(msg,isMaintenance=true){$('#main').innerHTML=`<section class="maintenance"><div class="logo" style="margin:auto">RSL</div><h1>${isMaintenance?'BOT ĐANG BẢO TRÌ':'BOT VỪA MỚI CẬP NHẬT'}</h1><p>${esc(msg||'Shop đang tạm ngưng để cập nhật. Vui lòng quay lại sau.')}</p></section>`}
function imgStyle(url){return url?`background-image:url('${esc(url).replace(/\\/g,'\\\\').replace(/'/g,'%27')}')`:''}
function frame(title,eyebrow,body){$('#main').innerHTML=`<section class="hero"><div class="eyebrow">${esc(eyebrow)}</div><h1>${esc(title)}</h1><p class="subtext">Hàng số chọn lọc · Giao key ngay sau khi thanh toán</p></section>${body}`}
function categoryCard(c,level='root'){const count=level==='root'?c.children.length:(c.products||[]).length;return `<button class="category" data-category="${c.id}" data-level="${level}"><div class="cover" style="${imgStyle(c.image_url)}"></div><div class="category-info"><div class="category-name">${esc(c.name)}</div><div class="category-meta">${count} ${level==='root'?'danh mục':'sản phẩm'}</div></div></button>`}
function categoryIllustration(c){return c.illustration_url?`<div class="category-illustration"><img src="${esc(c.illustration_url)}" alt="Ảnh minh hoạ ${esc(c.name)}" loading="lazy"></div>`:''}
function renderShop(){screen='shop';currentProduct=null;if(currentSub){const sub=currentRoot.children.find(x=>x.id===currentSub);if(!sub)return renderShop();frame(sub.name,currentRoot.name,`<div class="crumb"><button data-go="root">Cửa hàng</button><span> / </span><button data-go="root-detail">${esc(currentRoot.name)}</button><span> / ${esc(sub.name)}</span></div><button class="back" data-go="root-detail">← Danh mục ${esc(currentRoot.name)}</button>${categoryIllustration(sub)}<div class="grid">${(sub.products||[]).length?sub.products.map(productCard).join(''):'<div class="empty">Danh mục chưa có sản phẩm.</div>'}</div>`)}else if(currentRoot){frame(currentRoot.name,'DANH MỤC LỚN',`<div class="crumb"><button data-go="root">Cửa hàng</button><span> / ${esc(currentRoot.name)}</span></div><button class="back" data-go="root">← Tất cả danh mục</button>${categoryIllustration(currentRoot)}<div class="grid">${currentRoot.children.map(c=>categoryCard(c,'sub')).join('')||'<div class="empty">Chưa có danh mục nhỏ.</div>'}</div>${(currentRoot.products||[]).length?`<div class="sectionhead"><h2>Sản phẩm</h2></div><div class="grid">${currentRoot.products.map(productCard).join('')}</div>`:''}`)}else{frame('Tìm đúng key. Mua thật nhanh.','RSL SELECTS',`<div class="sectionhead"><h2>Danh mục nổi bật</h2><span>${roots.length} danh mục</span></div><div class="grid">${roots.length?roots.map(c=>categoryCard(c)).join(''):'<div class="empty">Chưa có danh mục đang mở bán.</div>'}</div><div class="notice">Chọn danh mục để xem sản phẩm. Số lượng key còn trong kho luôn được hiển thị trước khi mua.</div>`)}bindCategoryClicks()}
function productCard(p){return `<button class="product" data-product="${esc(p.code)}"><div class="product-cover" style="${imgStyle(p.image_url)}"></div><div class="product-info"><span class="product-title">${esc(p.name)}</span><span class="price">${money(p.price)}</span><span class="stock ${p.stock<=0?'out':''}">${p.stock>0?`Còn ${p.stock} key`:'Đã hết hàng'}</span></div></button>`}
function allProducts(){const out=[];for(const root of roots){out.push(...(root.products||[]));for(const sub of root.children)out.push(...(sub.products||[]))}return out}
function bindCategoryClicks(){document.querySelectorAll('[data-category]').forEach(b=>b.onclick=()=>{const c=b.dataset.level==='root'?roots.find(x=>String(x.id)===b.dataset.category):currentRoot?.children.find(x=>String(x.id)===b.dataset.category);if(b.dataset.level==='root'){currentRoot=c;currentSub=null;renderShop()}else{currentSub=c?.id;renderShop()}});document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{if(b.dataset.go==='root'){currentRoot=null;currentSub=null}else if(b.dataset.go==='root-detail'){currentSub=null}renderShop()});document.querySelectorAll('[data-product]').forEach(b=>b.onclick=()=>openProduct(b.dataset.product))}
function openProduct(code){currentProduct=allProducts().find(p=>p.code===code);if(!currentProduct)return;renderProduct()}
function renderProduct(){screen='shop';const p=currentProduct;const stock=p.stock;frame('Chi tiết sản phẩm','RSL · PRODUCT',`<button class="back" id="productBack">← Quay lại danh mục</button><article class="detail"><div class="detail-cover" style="${imgStyle(p.image_url)}"></div><div class="detail-body"><div class="eyebrow">SẢN PHẨM SỐ</div><h2>${esc(p.name)}</h2><div class="detail-desc">Key được hiển thị trực tiếp trên màn hình sau khi mua thành công.</div><div class="detail-price">${money(p.price)} <span style="font-size:12px;color:var(--muted);font-weight:500">/ key</span></div><div class="stock ${stock<=0?'out':''}">${stock>0?`Còn ${stock} key trong kho`:'Đã hết hàng'}</div><div class="qtyrow"><label for="quantity">Số lượng key muốn mua</label><input id="quantity" class="qty" type="number" min="1" max="${stock}" step="1" value="1" inputmode="numeric" ${stock<=0?'disabled':''}></div><div class="total"><span>Tổng thanh toán</span><b id="purchaseTotal">${money(p.price)}</b></div><button id="buyNow" class="action" ${stock<=0?'disabled':''}>${stock>0?'Mua ngay':'Đã hết hàng'}</button><p class="hint" style="font-size:10px;color:var(--muted);margin:10px 0 0">Giá hiển thị dành cho tài khoản ${account.seller?'seller':'user'}.</p></div></article>`);$('#productBack').onclick=()=>renderShop();const q=$('#quantity');q.addEventListener('input',()=>{const parsed=Number(q.value);if(!Number.isInteger(parsed)||parsed<1||parsed>stock)return;$('#purchaseTotal').textContent=money(p.price*parsed)});$('#buyNow').onclick=buyNow}
async function buyNow(){const btn=$('#buyNow');const quantity=Number($('#quantity')?.value||'0');if(!Number.isInteger(quantity)||quantity<1||quantity>currentProduct.stock)return toast('Số lượng không hợp lệ hoặc vượt quá tồn kho.');const total=currentProduct.price*quantity;if(Number(account.balance)<total)return toast(`Số dư không đủ. Cần ${money(total)}.`);btn.disabled=true;btn.textContent='Đang xử lý…';try{const d=await api('/api/miniapp/purchase',{method:'POST',body:JSON.stringify({product_code:currentProduct.code,quantity})});account.balance=d.balance;$('#balance').textContent=money(d.balance);renderReceipt(d)}catch(e){toast(e.message);btn.disabled=false;btn.textContent='Mua ngay';try{await refresh()}catch{}}}
function renderReceipt(d){screen='receipt';const keys=d.keys||[];const items=keys.map((k,i)=>`<div class="key"><code>${esc(k)}</code><button class="copy" data-copy="${i}">Sao chép</button></div>`).join('');frame('Đơn hàng hoàn tất','RSL · ORDER CONFIRMED',`<div class="sheet"><div class="eyebrow">ĐÃ THANH TOÁN</div><h2 style="font-size:18px;margin:6px 0">${esc(d.product_name)}</h2><p class="subtext">${d.quantity} key · ${money(d.unit_price)} / key</p><div class="total" style="margin:14px 0 0"><span>Đã trừ trong số dư</span><b>${money(d.total)}</b></div><div class="total"><span>Số dư còn lại</span><b>${money(d.balance)}</b></div></div><div class="sectionhead"><h2>Key của bạn</h2><span>${keys.length} key</span></div><div class="keys">${items}</div><button id="copyAll" class="secondary">Sao chép tất cả key</button><button id="backShop" class="action" style="margin-top:10px">Tiếp tục mua sắm</button>`);document.querySelectorAll('[data-copy]').forEach(b=>b.onclick=()=>copy(keys[Number(b.dataset.copy)]));$('#copyAll').onclick=()=>copy(keys.join('\n'));$('#backShop').onclick=()=>{currentRoot=null;currentSub=null;renderShop()}}
async function copy(s){try{await navigator.clipboard.writeText(s);toast('Đã sao chép vào bộ nhớ tạm.')}catch{const x=document.createElement('textarea');x.value=s;document.body.append(x);x.select();document.execCommand('copy');x.remove();toast('Đã sao chép.')}}
function openAccount(){showAccount()}
function profileAvatarMarkup(){const u=window._tgUser||{};const photo=account.photo_url||u.photo_url;if(photo)return `<img class="profile-avatar" src="${esc(photo)}" alt="Ảnh đại diện Telegram">`;const initial=(account.name||u.first_name||'').trim().charAt(0).toUpperCase()||'•';return `<div class="profile-fallback">${esc(initial)}</div>`}
function showAccount(){screen='account';const u=window._tgUser||{};frame('Tài khoản của bạn','TÀI KHOẢN TELEGRAM',`<div class="sheet" style="display:flex;align-items:center;gap:13px">${profileAvatarMarkup()}<div><div style="font-weight:780">${esc(account.name||u.first_name||'Khách hàng')}</div><div class="subtext">ID Telegram · ${esc(account.id||u.id||'')}</div><div class="subtext">Vai trò · ${account.seller?'Seller':'User'}</div></div></div><div class="account"><div class="stat"><small>Số dư hiện tại</small><strong style="color:var(--teal)">${money(account.balance)}</strong></div><div class="stat"><small>Tổng nạp đã xác nhận</small><strong>${money(account.total_deposited)}</strong></div><div class="stat"><small>Tổng chi mua key</small><strong>${money(account.total_spent)}</strong></div><div class="stat"><small>Tổng key đã mua</small><strong>${money(account.total_keys)}</strong></div></div><button class="action" id="accountDeposit">Nạp tiền thủ công</button><div class="notice">Mọi yêu cầu nạp đều được admin đối chiếu thủ công. Bot không tự động xác nhận giao dịch ngân hàng.</div><div class="sectionhead"><h2>Key đã mua</h2><span id="historyCount">Đang tải…</span></div><div id="purchaseHistory"><div class="loading">Đang tải lịch sử mua…</div></div><button id="loadMoreHistory" class="secondary" style="display:none">Xem thêm đơn hàng</button>`);$('#accountDeposit').onclick=renderDeposit;loadPurchaseHistory(true)}
function formatPurchaseDate(value){const d=new Date(value);return Number.isNaN(d.getTime())?String(value||''):new Intl.DateTimeFormat('vi-VN',{dateStyle:'medium',timeStyle:'short'}).format(d)}
function renderPurchaseHistory(){const panel=$('#purchaseHistory');if(!panel)return;$('#historyCount').textContent=`${purchaseHistoryTotal} đơn`;if(!purchaseHistory.length){panel.innerHTML='<div class="history-empty">Bạn chưa mua key nào. Các giao dịch thành công sẽ được lưu tại đây.</div>';$('#loadMoreHistory').style.display='none';return}panel.innerHTML=purchaseHistory.map((p,i)=>`<article class="purchase-record"><div class="purchase-top"><div><div class="purchase-id">Đơn #${esc(String(p.transaction_id||'').slice(0,8).toUpperCase())}</div><div class="purchase-date">${esc(formatPurchaseDate(p.purchased_at))}</div></div><div class="purchase-total">${money(p.total)}</div></div><div class="purchase-details"><div class="purchase-field"><small>Danh mục</small><strong>${esc(p.category_path||'Chưa lưu danh mục')}</strong></div><div class="purchase-field"><small>Sản phẩm</small><strong>${esc(p.product_name||p.product_code)}</strong></div><div class="purchase-field"><small>Số lượng · đơn giá</small><strong>${Number(p.quantity)} key · ${money(p.unit_price)} / key</strong></div></div><div class="purchase-keys">${(p.keys||[]).map(k=>`<div class="purchase-key"><code>${esc(k)}</code><button class="copy" data-copy-purchase-key="${esc(k)}">Sao chép</button></div>`).join('')}</div><button class="secondary" data-copy-purchase-all="${i}">Sao chép tất cả key của đơn này</button></article>`).join('');panel.querySelectorAll('[data-copy-purchase-key]').forEach(b=>b.onclick=()=>copy(b.dataset.copyPurchaseKey));panel.querySelectorAll('[data-copy-purchase-all]').forEach(b=>b.onclick=()=>copy((purchaseHistory[Number(b.dataset.copyPurchaseAll)]?.keys||[]).join('\n')));const more=$('#loadMoreHistory');more.style.display=purchaseHistory.length<purchaseHistoryTotal?'block':'none';more.onclick=()=>loadPurchaseHistory(false)}
async function loadPurchaseHistory(reset=false){const panel=$('#purchaseHistory');if(!panel||purchaseHistoryLoading)return;purchaseHistoryLoading=true;if(reset){purchaseHistory=[];purchaseHistoryTotal=0;panel.innerHTML='<div class="loading">Đang tải lịch sử mua…</div>'}try{const d=await api(`/api/miniapp/purchases?limit=20&offset=${reset?0:purchaseHistory.length}`);purchaseHistory.push(...(d.purchases||[]));purchaseHistoryTotal=Number(d.total||0);renderPurchaseHistory()}catch(e){panel.innerHTML=`<div class="history-empty">Không tải được lịch sử mua: ${esc(e.message)}</div>`}finally{purchaseHistoryLoading=false}}
function renderTopDeposits(){screen='top';frame('Top nạp','BẢNG XẾP HẠNG',`<div class="notice">Top 50 theo tổng tiền nạp tích lũy đã được admin xác nhận. @username và số tiền được hiển thị công khai trong Mini App; tài khoản không có username sẽ không hiện trong bảng.</div><div class="sectionhead"><h2>Người nạp nhiều nhất</h2><span id="topDepositCount">Đang tải…</span></div><div id="topDeposits"><div class="loading">Đang tải bảng xếp hạng…</div></div><button id="refreshTopDeposits" class="secondary">Làm mới bảng xếp hạng</button>`);$('#refreshTopDeposits').onclick=loadTopDeposits;loadTopDeposits()}
async function loadTopDeposits(){const panel=$('#topDeposits');if(!panel)return;panel.innerHTML='<div class="loading">Đang tải bảng xếp hạng…</div>';try{const d=await api('/api/miniapp/top-deposits');const entries=d.entries||[];$('#topDepositCount').textContent=`${entries.length} / 50 tài khoản`;panel.innerHTML=entries.length?`<div class="top-deposit-list">${entries.map((x,i)=>`<article class="top-deposit-entry"><div class="top-deposit-rank">${String(x.rank||i+1).padStart(2,'0')}</div><div><div class="top-deposit-username">@${esc(String(x.username||'').replace(/^@/,''))}</div><div class="top-deposit-caption">Tổng nạp đã xác nhận</div></div><div class="top-deposit-total">${money(x.total_deposited)}</div></article>`).join('')}</div>`:'<div class="empty">Chưa có khoản nạp nào được admin xác nhận.</div>'}catch(e){panel.innerHTML=`<div class="empty">Không tải được bảng Top nạp: ${esc(e.message)}</div>`}}
function renderDeposit(){screen='deposit';deposit=null;frame('Nạp tiền vào tài khoản','NẠP TIỀN · ADMIN DUYỆT THỦ CÔNG',`<div class="sheet"><div class="eyebrow">TẠO YÊU CẦU NẠP</div><label for="depositAmount" class="subtext">Nhập số tiền chuyển (VNĐ)</label><input id="depositAmount" class="field" type="number" min="2000" step="1000" inputmode="numeric" placeholder="Tối thiểu 2.000đ"><button id="makeDeposit" class="action">Tạo yêu cầu nạp</button><p class="hint" style="color:var(--muted);font-size:11px">Số tiền nạp tối thiểu là 2.000đ. Tiền chỉ được cộng vào số dư sau khi admin kiểm tra giao dịch và bấm Xác nhận.</p></div>`);$('#makeDeposit').onclick=createDeposit}
async function createDeposit(){const n=Number($('#depositAmount').value);if(!Number.isSafeInteger(n)||n<2000)return toast('Số tiền nạp tối thiểu là 2.000đ.');depositAmount=n;const b=$('#makeDeposit');b.disabled=true;b.textContent='Đang tạo…';try{deposit=await api('/api/miniapp/deposits',{method:'POST',body:JSON.stringify({amount:n})});renderDepositRequest()}catch(e){toast(e.message);b.disabled=false;b.textContent='Tạo yêu cầu nạp'}}
function renderDepositRequest(){screen='deposit';const d=deposit;frame('Chuyển khoản','YÊU CẦU NẠP · #'+d.id,`<div class="sheet"><div class="eyebrow">QUÉT QR VÀ CHUYỂN ĐÚNG SỐ TIỀN</div><img class="qr" src="${API}/api/miniapp/qr?amount=${encodeURIComponent(d.amount)}&addInfo=${encodeURIComponent(d.payment_code)}" alt="QR thanh toán" onerror="this.style.display='none'"><div class="subtext" style="text-align:center">Số tiền cần chuyển</div><div style="text-align:center;font-size:23px;font-weight:850;color:var(--teal);margin:4px 0 13px">${money(d.amount)}</div><div class="subtext" style="text-align:center">Nội dung chuyển khoản bắt buộc</div><div class="code" style="margin-top:7px">${esc(d.payment_code)}</div><button id="copyPaymentCode" class="secondary" style="margin-top:8px">Sao chép nội dung</button><div class="notice">Hãy chuyển khoản đúng số tiền và nội dung ở trên. Sau khi chuyển, bấm “Tôi đã chuyển tiền” để báo admin. Tiền chưa được cộng tự động.</div><button id="submittedDeposit" class="action">Tôi đã chuyển tiền · Báo admin</button><button id="checkDeposit" class="secondary" style="margin-top:9px">Kiểm tra trạng thái</button></div>`);$('#copyPaymentCode').onclick=()=>copy(d.payment_code);$('#submittedDeposit').onclick=submitDeposit;$('#checkDeposit').onclick=checkDeposit}
async function submitDeposit(){const b=$('#submittedDeposit');b.disabled=true;b.textContent='Đang báo admin…';try{const d=await api(`/api/miniapp/deposits/${deposit.id}/submitted`,{method:'POST',body:'{}'});toast(d.message);b.textContent='Đã báo admin · Chờ xác nhận';$('#checkDeposit').classList.remove('hidden')}catch(e){toast(e.message);b.disabled=false;b.textContent='Tôi đã chuyển tiền · Báo admin'}}
async function checkDeposit(){try{const d=await api(`/api/miniapp/deposits/${deposit.id}`);if(d.status==='accepted'){toast('Admin đã xác nhận nạp tiền.');await refresh();showAccount()}else if(d.status==='rejected'){toast('Yêu cầu nạp đã bị từ chối. Liên hệ admin nếu cần.')}else toast('Yêu cầu vẫn đang chờ admin đối chiếu.')}catch(e){toast(e.message)}}
async function refresh(){const d=await api('/api/miniapp/catalog');account=d.user;roots=d.categories||[];window._tgUser=tg?.initDataUnsafe?.user||{};$('#balance').textContent=money(account.balance);const av=$('#avatar');if(account.photo_url){av.src=account.photo_url;av.style.display='block'}if(screen==='account')showAccount();else if(screen==='shop')renderShop();else if(screen==='top')renderTopDeposits();return d}
function setTab(name){document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x.dataset.tab===name));if(name==='shop'){screen='shop';currentRoot=null;currentSub=null;renderShop()}else if(name==='account')showAccount();else if(name==='top')renderTopDeposits();else renderDeposit()}
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>setTab(b.dataset.tab));
async function start(){if(!tg||!initData){$('#loading').innerHTML='Hãy mở cửa hàng từ nút <b>Mở cửa hàng</b> trong Telegram bot để xác thực tài khoản.';return}tg.ready();tg.expand();try{await refresh()}catch(e){if(!$('#main').querySelector('.maintenance'))$('#loading').textContent=e.message}}
start();
})();
</script>
</body>
</html>
